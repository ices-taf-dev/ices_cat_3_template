
name: Run TAF and publish results

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.R'
      - 'boot/initial/data/**'
      - 'boot/DATA.bib'
      - 'boot/SOFTWARE.bib'

jobs:
  taf:
    uses: ices-tools-prod/workflows/.github/workflows/taf-run.yml@ddb36a09cfd67b8888c27853c45c14695ad96881
    with:
      r-version: "release"
      timeout-minutes: 10
