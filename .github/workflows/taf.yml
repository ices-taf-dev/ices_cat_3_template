
name: Run TAF and publish results

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.R'
      - 'boot/initial/data/**'
      - 'boot/DATA.bib'
      - 'boot/SOFTWARE.bib'

jobs:
  taf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: |
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '--no-taf')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to create/push branches

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: |
            https://cloud.r-project.org
            https://ices-tools-prod.r-universe.dev
            https://packagemanager.posit.co/cran/__linux__/jammy/latest

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::TAF

      - name: Run TAF
        run: |
          Rscript -e "TAF::clean.boot(force = TRUE)"
          Rscript -e "TAF::clean()"
          Rscript -e "TAF::taf.boot()"
          Rscript -e "TAF::source.all()"

      - name: Commit results to taf branch (clean tree, preserved history)
        run: |
          git config user.email "github@ices.dk"
          git config user.name "ices-github-bot"

          # Fetch remote taf if it exists
          git fetch origin taf || true

          # Start from an empty index (clean-slate content)
          git checkout --orphan taf-tmp

          # Remove GitHub workflows from results branch
          if [ -d ".github" ]; then
            git rm -rf .github
          fi

          # Stage *everything* that exists in the working tree
          # (respects .gitignore except where -f is used later)
          git add -A

          # Force-add TAF result folders if they exist
          for dir in data model report output; do
            if [ -d "$dir" ]; then
              git add -f "$dir"
            fi
          done

          # Abort if nothing changed
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Create commit tree
          TREE=$(git write-tree)

          # If remote taf exists, use it as parent; otherwise create root commit
          if git show-ref --quiet refs/remotes/origin/taf; then
            PARENT=$(git rev-parse origin/taf)
            COMMIT=$(echo "Run TAF and publish results" | \
              git commit-tree "$TREE" -p "$PARENT")
          else
            COMMIT=$(echo "Run TAF and publish results" | \
              git commit-tree "$TREE")
          fi

          # Update taf branch to point at new commit
          git update-ref refs/heads/taf "$COMMIT"

          # Generate unique TAF run ID
          TAG="run-$(date -u +%Y%m%d-%H%M)"

          # ----- determine tag prefix from commit message -----
          MSG="${{ github.event.head_commit.message }}"

          # override if commit message contains --tag-final or --tag-advice
          if echo "$MSG" | grep -q -- "--tag-final"; then
            TAG="final-$(date -u +%Y)"
          elif echo "$MSG" | grep -q -- "--tag-advice"; then
            TAG="advice-$(date -u +%Y)"
          fi

          # Tag this commit with the TAF ID
          git tag "$TAG" "$COMMIT"

          # Push branch and tag
          git push origin refs/heads/taf:taf --tags --force
